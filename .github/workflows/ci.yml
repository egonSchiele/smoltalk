name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build smoltalk first so smoltalk-llama-cpp can resolve types via dist/
      - run: pnpm --filter smoltalk build
      # Build smoltalk-llama-cpp too: its loader integration test dynamically
      # imports this package's dist/index.js, built fresh right here.
      - run: pnpm --filter smoltalk-llama-cpp build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build

  readme-check:
    name: readme code blocks typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The README check imports from "smoltalk"; smoltalk-llama-cpp
      # transitively requires it too. Build both so types resolve.
      - run: pnpm -r build
      - run: pnpm --filter readme-check check

  pack:
    name: pack tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: pack tarballs
        run: |
          cd packages/smoltalk && pnpm pack --pack-destination /tmp
          cd ../smoltalk-llama-cpp && pnpm pack --pack-destination /tmp
          cd ../smoltalk-webllm && pnpm pack --pack-destination /tmp
      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: /tmp/*.tgz
          retention-days: 1

  install-simulation:
    name: install simulation (npm)
    needs: [test, pack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: /tmp
      - name: install via npm in fresh consumer
        run: |
          mkdir -p /tmp/consumer
          cp scripts/ci-fixture/index.ts /tmp/consumer/
          cp scripts/ci-fixture/package.json /tmp/consumer/
          cd /tmp/consumer
          npm pkg set name=consumer >/dev/null
          # Install all three workspace tarballs explicitly (the smoltalk-* glob
          # matches them all but being explicit avoids any peer-resolution surprise).
          npm install \
            /tmp/smoltalk-0*.tgz \
            /tmp/smoltalk-llama-cpp-*.tgz \
            /tmp/smoltalk-webllm-*.tgz
          npm install --save-dev typescript@5
      - name: compile fixture (ESM, supports top-level await)
        working-directory: /tmp/consumer
        # --skipLibCheck because @google/genai's .d.ts references a transitive
        # peer dep we don't install (@modelcontextprotocol/sdk).
        # --strict so discriminated-union narrowing (Result<T>) works in the fixture.
        run: npx tsc --target esnext --module nodenext --moduleResolution nodenext --skipLibCheck --strict index.ts
      - name: run fixture
        working-directory: /tmp/consumer
        run: node index.js
      - name: smoltalk-webllm SSR import smoke (must not crash in Node)
        working-directory: /tmp/consumer
        # The whole point of the dynamic import inside engine.ts is that
        # `import "smoltalk-webllm"` does not crash in a Node/SSR context
        # even though @mlc-ai/web-llm references browser globals.
        run: |
          node --input-type=module -e "
            const mod = await import('smoltalk-webllm');
            if (typeof mod.WebLLMClient !== 'function') {
              console.error('WebLLMClient not exported');
              process.exit(1);
            }
            if (typeof mod.loadModel !== 'function') {
              console.error('loadModel not exported');
              process.exit(1);
            }
            console.log('OK: smoltalk-webllm imports cleanly in Node');
          "

  bundler-smoke:
    name: esbuild bundler smoke
    needs: [test, pack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: /tmp
      - name: bundle the smoltalk-only fixture
        run: |
          mkdir -p /tmp/bundle
          cp scripts/ci-fixture/index.ts /tmp/bundle/
          cp scripts/ci-fixture/package.json /tmp/bundle/
          cd /tmp/bundle
          npm install /tmp/smoltalk-*.tgz
          npm install --save-dev esbuild typescript@5
          # ESM output so the fixture's top-level await works; package.json has type:module already.
          # The --banner provides require() via createRequire so transitive CJS deps
          # (e.g. google-auth-library, via @google/genai) that use dynamic require still work.
          npx esbuild --bundle --platform=node --target=node20 --format=esm \
            --banner:js='import{createRequire}from"module";const require=createRequire(import.meta.url);' \
            --metafile=meta.json --outfile=bundle.js index.ts
      - name: assert no node-llama-cpp module in bundle
        working-directory: /tmp/bundle
        run: |
          node -e "
            const meta = require('./meta.json');
            const offenders = Object.keys(meta.inputs).filter(k => k.includes('node-llama-cpp'));
            if (offenders.length > 0) {
              console.error('bundle includes node-llama-cpp modules:', offenders);
              process.exit(1);
            }
            console.log('bundle is clean of node-llama-cpp');
          "
      - name: run bundle
        run: node /tmp/bundle/bundle.js
