name: Refresh model data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate model-data.json from models.dev
        run: pnpm --filter smoltalk refresh-data
      - name: Open PR if data changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(data): refresh model-data.json from models.dev"
          title: "Refresh model data from models.dev"
          body: |
            Automated refresh of `packages/smoltalk/data/model-data.json` from models.dev.

            **Review the pricing/limit diff before merging.** models.dev is community-edited.
          branch: automation/refresh-model-data
          add-paths: packages/smoltalk/data/model-data.json
